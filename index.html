<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree | Neobrutalism</title>
    <!-- Google Fonts: Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <div id="app" x-data="linktree">
      
      <!-- Profile Section -->
      <header class="profile-header text-center animate-pop">
        <div class="avatar-container">
          <img :src="profile.avatar" :alt="profile.name" class="avatar">
        </div>
        <div class="text-center">
          <h1 class="username" x-text="profile.name"></h1>
          <div style="display: block;">
            <p class="bio" x-text="profile.bio"></p>
          </div>
        </div>
      </header>

      <!-- Links Section -->
      <main class="links-container">
        <template x-for="link in links" :key="link.id">
          <a :href="link.url" target="_blank" 
             class="link-button"
             :class="link.colorClass">
            <span x-text="link.title"></span>
          </a>
        </template>
      </main>

      <!-- Footer / Social links -->
      <footer class="footer">
        <template x-for="social in socials" :key="social.id">
          <a :href="social.url" target="_blank" 
             class="social-icon"
             :class="social.colorClass"
             :aria-label="social.name">
            <i :class="social.icon"></i>
          </a>
        </template>
      </footer>

    </div>
    <!-- Script -->
    <script src="./src/script.js"></script>
  </body>
</html>
